<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
@page { size: A4; margin: 0 }
* { box-sizing: border-box }
body { font-synthesis: none; margin: 0; padding: 16mm 16mm; font-family: "Noto Sans JP", "IPAGothic", "IPAPGothic", sans-serif; font-size: 10.5pt; color: #111; line-height: 1.45 }
h1 { font-size: 22pt; letter-spacing: .5em; text-align: center; margin: 0 0 10mm }
table { border-collapse: collapse; width: 100% }
.items th, .items td { border: 1px solid #444; padding: 2mm 2.5mm }
.items th { background: #eee; font-weight: 600 }
.num { text-align: right; white-space: nowrap }
.row { display: flex; justify-content: space-between; gap: 10mm }
.small { font-size: 9pt }
.box { border: 2px solid #111; padding: 3mm 5mm; font-size: 14pt; display: inline-block }
.totals { margin-left: auto; width: 82mm; margin-top: 6mm }
.totals td { padding: 1.2mm 2mm }
.totals .grand td { border-top: 2px solid #111; font-weight: 700 }
.mt { margin-top: 8mm }
</style></head><body>{% block body %}{% endblock %}</body></html>
