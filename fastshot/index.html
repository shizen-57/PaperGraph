<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fastshot — Describe an app. We'll build it.</title>
<meta name="description" content="Fastshot turns a written description into a working app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
<script>document.documentElement.classList.add('anim')</script>
<style>
:root {
  --u: min(0.06410256vw, 0.12400794vh);
  --vu: 0.09920635vh;
  --inset-top: 41; --inset-bottom: 106;

  --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: Inter, var(--font-text);

  /* nav */
  --brand-x: 225; --brand-y: 45; --mark: 34; --brand-gap: 12; --brand-fs: 18.49;
  --links-y: 50.5; --links-gap: 50; --links-fs: 21.69;
  --cta-x: 1195; --cta-y: 42; --cta-w: 140; --cta-h: 43; --cta-r: 12; --cta-fs: 15.70; --cta-dy: 2;
  /* hero */
  --hero-gap: 51;
  --h1-y: 323; --h1-fs: 36.25; --display-ls: 0.0018em;
  --nav-ls: -0.0115em; --brand-ls: -0.0154em; --cta-ls: -0.0127em; --body-ls: 0.007em;
  --label-ls: normal; --model-ls: normal; --proof-ls: 0.0065em;
  --w-regular: 400; --w-display-wght: 410; --w-medium: 500; --w-semibold: 600;
  --w-display: var(--w-display-wght); --w-nav: 400; --w-brand: 500; --w-cta: 520;
  --w-body: var(--w-regular); --w-label: var(--w-medium);
  --w-model: var(--w-regular); --w-proof: 480;
  /* composer */
  --card-x: 425; --card-y: 413; --card-w: 708; --card-h: 143; --card-r: 26;
  --ph-x: 452; --ph-y: 446; --ph-fs: 9.97;
  --chips-x: 444; --chips-y: 505; --chip-h: 30; --chip-r: 9; --chip-fs: 9.0; --chip-gap: 5.5;
  --son-fs: 10.4; --son-top: 15.5; --chev-gap: 6.2;
  --chev-x: 1013.5; --chev-y: 522.3;
  --att-x: 1043.2; --att-y: 515.1;
  --send-x: 1084; --send-y: 507; --send-d: 35;
  /* footer */
  --by-y: 799; --by-fs: 14.01; --logo-y: 867; --logo-gap: 62;

  --e-primary: cubic-bezier(.16, 1, .3, 1);
  --e-soft: cubic-bezier(.22, 1, .36, 1);
}
@supports (height: 100dvh) {
  :root { --u: min(0.06410256vw, 0.12400794dvh); --vu: 0.09920635dvh; }
}
@media (min-width: 1561px) {
  :root { --inset-top: 27; --inset-bottom: 74; }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
img, svg { display: block; }
html, body { height: 100%; }
body {
  background: #0a0d12; color: #fff;
  font-family: var(--font-text); font-weight: 400;
  font-synthesis: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #F8B285; outline-offset: 3px; border-radius: 4px; }

/* ---------- stage ---------- */
.stage { position: fixed; inset: 0; overflow: hidden; background: #0a0d12; }
.stage-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.frame {
  position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
  padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
}
.menu-toggle { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* ---------- nav ---------- */
.nav {
  position: relative; flex: none; height: calc(43 * var(--u));
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: inline-flex; align-items: center; gap: calc(var(--brand-gap) * var(--u)); }
.mark { width: calc(var(--mark) * var(--u)); height: calc(var(--mark) * var(--u)); flex: none; }
.wordmark {
  font-family: var(--font-display); font-size: calc(var(--brand-fs) * var(--u));
  font-weight: var(--w-brand); letter-spacing: var(--brand-ls); line-height: 1;
  font-variation-settings: "opsz" 32;
  transform: translateY(calc(1 * var(--u)));
  text-shadow: 0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30);
}
.links {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc((var(--links-y) - 41) * var(--u));
  display: flex; gap: calc(var(--links-gap) * var(--u));
}
.links a {
  font-family: var(--font-text); font-size: calc(var(--links-fs) * var(--u));
  font-weight: var(--w-nav); letter-spacing: var(--nav-ls); line-height: 1.2; color: #fff; white-space: nowrap;
  text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .32);
  transition: opacity .18s ease;
}
.links a:hover { opacity: .72; }
.cta {
  align-self: flex-start; margin-top: calc((var(--cta-y) - 41) * var(--u));
  width: calc(var(--cta-w) * var(--u)); height: calc(var(--cta-h) * var(--u));
  border-radius: calc(var(--cta-r) * var(--u));
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  font-family: var(--font-text); font-size: calc(var(--cta-fs) * var(--u));
  font-weight: var(--w-cta); letter-spacing: var(--cta-ls); line-height: 1; white-space: nowrap;
  background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, .10), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, .28);
  transition: filter .18s ease;
}
.cta span { transform: translateY(calc(var(--cta-dy) * var(--u))); }
.cta:hover { filter: brightness(1.16); }
.cta:active { transform: translateY(1px); }

.burger {
  display: none; width: 38px; height: 38px; border-radius: 11px; cursor: pointer;
  background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .14);
  align-items: center; justify-content: center;
}
.burger svg { width: 17px; height: 12px; fill: #fff; }
#menu:focus-visible ~ .nav .burger { outline: 2px solid #F8B285; outline-offset: 3px; }

/* mobile menu (CSS only) */
.sheet { display: none; }
.sheet-clip { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s .32s; }
#menu:checked ~ .sheet .sheet-clip { visibility: visible; transition-delay: 0s; }
.sheet-panel {
  margin-top: 12px; display: flex; flex-direction: column; gap: 2px; padding: 10px;
  background: rgba(24, 24, 27, .86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, .09); border-radius: 16px;
}
.sheet-panel a { font-size: 15px; padding: 10px 12px; border-radius: 10px; }
.sheet-panel a:hover { background: rgba(255, 255, 255, .06); }
.sheet-panel .sheet-cta {
  margin-top: 6px; height: 40px; border-radius: 11px; font-size: 15px; font-weight: var(--w-cta);
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 2px 14px rgba(0, 0, 0, .28);
}

/* ---------- hero ---------- */
.hero {
  flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--hero-gap) * var(--vu)); padding-bottom: calc(4 * var(--vu));
}
.h1 {
  font-family: var(--font-display); font-size: calc(var(--h1-fs) * var(--u));
  font-weight: var(--w-display); line-height: 1.10; letter-spacing: var(--display-ls);
  font-variation-settings: "opsz" 32; text-align: center; color: #fff;
  text-shadow: 0 calc(2 * var(--u)) calc(22 * var(--u)) rgba(0, 0, 0, .30);
}

/* ---------- composer ---------- */
.card {
  position: relative; flex: none;
  width: calc(var(--card-w) * var(--u)); height: calc(var(--card-h) * var(--u));
  margin-right: calc(3 * var(--u)); border-radius: calc(var(--card-r) * var(--u));
  background: rgba(41, 41, 43, .955);
  backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
  -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
  box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .30);
}
.ph {
  position: absolute;
  left: calc((var(--ph-x) - var(--card-x)) * var(--u));
  top: calc((var(--ph-y) - var(--card-y)) * var(--u));
  right: calc(24 * var(--u));
  color: #8B8C8E; font-size: calc(var(--ph-fs) * var(--u)); font-weight: var(--w-body);
  line-height: 1.35; letter-spacing: var(--body-ls); white-space: nowrap; overflow: hidden;
}
.tools {
  position: absolute;
  left: calc((var(--chips-x) - var(--card-x)) * var(--u));
  top: calc((var(--chips-y) - var(--card-y)) * var(--u));
  right: calc((var(--card-x) + var(--card-w) - 1134) * var(--u));
  height: calc(var(--chip-h) * var(--u));
}
.chips { display: flex; align-items: center; gap: calc(var(--chip-gap) * var(--u)); }
.chip {
  display: inline-flex; align-items: center; flex: none;
  width: calc(var(--cw) * var(--u)); height: calc(var(--chip-h) * var(--u));
  padding-left: calc(var(--pl) * var(--u)); gap: calc(var(--ig) * var(--u));
  border-radius: calc(var(--chip-r) * var(--u));
  font-size: calc(var(--chip-fs) * var(--u)); font-weight: var(--w-label); letter-spacing: var(--label-ls);
  line-height: 1; color: #909093; white-space: nowrap;
  background: linear-gradient(180deg, rgba(255, 255, 255, .088) 0%, rgba(255, 255, 255, .050) 45%, rgba(255, 255, 255, .038) 100%);
  border: 1px solid rgba(255, 255, 255, .05);
  transition: color .18s ease;
}
.chip:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .07)); color: #c8c8cb; }
.chip span { transform: translateY(calc(2 * var(--u))); }
.ic { flex: none; width: calc(var(--iw) * var(--u)); height: auto; fill: currentColor; }

/* Right cluster: absolute coordinates on desktop, NOT a flex group */
.right { position: absolute; inset: 0; pointer-events: none; }
.right > * { position: absolute; pointer-events: auto; }
.model {
  left: calc(510.2 * var(--u)); top: calc(var(--son-top) * var(--u));
  display: inline-flex; align-items: center; gap: calc(var(--chev-gap) * var(--u));
  font-size: calc(var(--son-fs) * var(--u)); font-weight: var(--w-model); letter-spacing: var(--model-ls);
  line-height: 1; color: #98999C; white-space: nowrap;
}
.chev { width: calc(6.8 * var(--u)); height: auto; flex: none; }
.attach { left: calc(599.15 * var(--u)); top: calc(10.14 * var(--u)); color: #A9AAAD; line-height: 0; transition: color .18s ease; }
.attach:hover { color: #fff; }
.attach svg { width: calc(19.79 * var(--u)); height: auto; }
.send {
  left: calc((var(--send-x) - var(--chips-x)) * var(--u)); top: calc((var(--send-y) - var(--chips-y)) * var(--u));
  width: calc(var(--send-d) * var(--u)); height: calc(var(--send-d) * var(--u)); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
  box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(210, 110, 60, .34);
  transition: filter .18s ease, transform .18s ease;
}
.send:hover { filter: brightness(1.07); }
.send:active { transform: scale(.95); }
.send svg { width: calc(11.66 * var(--u)); height: auto; fill: #fff; }

/* ---------- footer ---------- */
.proof { flex: none; display: flex; flex-direction: column; align-items: center; gap: calc(52.3 * var(--vu)); }
.by {
  font-family: var(--font-display); font-size: calc(var(--by-fs) * var(--u)); font-weight: var(--w-proof);
  letter-spacing: var(--proof-ls); line-height: 1.1; color: rgba(255, 255, 255, .95);
  font-variation-settings: "opsz" 32;
  text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .35);
}
.logos { display: flex; align-items: center; gap: calc(var(--logo-gap) * var(--u)); color: #fff; }
.logos svg {
  width: calc(var(--lw) * var(--u)); height: auto; fill: currentColor;
  filter: drop-shadow(0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30));
}
.logos text { font-family: var(--font-text); font-weight: 500; }

/* ---------- 2) TABLET: fluid desktop, one-row toolbar ---------- */
@media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
  :root { --u: 1px; }
  .frame { padding: clamp(24px, 3.4vh, 44px) clamp(28px, 4.2vw, 60px) clamp(26px, 4.4vh, 56px); }
  .h1 { font-size: clamp(27px, 4.3vw, 44px); line-height: 1.12; white-space: nowrap; }
  .card {
    width: min(100%, clamp(516px, 74vw, 760px)); height: auto; margin-right: 0;
    padding: clamp(15px, 1.9vw, 24px); border-radius: clamp(17px, 2.1vw, 26px);
    display: flex; flex-direction: column; gap: clamp(20px, 3.2vh, 44px);
  }
  .ph { position: static; white-space: normal; font-size: clamp(11px, 1.35vw, 14px); line-height: 1.4; }
  .tools { position: static; height: auto; display: flex; flex-direction: row; flex-wrap: wrap; gap: clamp(10px, 1.4vw, 18px); }
  .chips { flex-wrap: nowrap; gap: clamp(6px, 0.85vw, 10px); }
  .chip { width: auto; height: clamp(29px, 3.4vh, 34px); padding: 0 clamp(7px, 1vw, 13px); font-size: clamp(9.6px, 1.12vw, 12.5px); }
  .right { position: static; display: flex; align-items: center; margin-left: auto; gap: 0; }
  .right > * { position: static; }
  .model { font-size: clamp(9.8px, 1.12vw, 12.5px); }
  .attach { margin-left: clamp(9px, 1.4vw, 20px); }
  .send { margin-left: clamp(9px, 1.3vw, 18px); width: clamp(32px, 3.5vw, 38px); height: clamp(32px, 3.5vw, 38px); }
  .proof { gap: clamp(15px, 2.5vh, 30px); }
}

/* ---------- 3) COMPACT: phone, or short landscape ---------- */
@media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
  :root { --u: 1px; }
  .frame {
    padding:
      max(18px, env(safe-area-inset-top))
      max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-left));
  }
  .links, .nav .cta { display: none; }
  .burger { display: flex; }
  .mark { width: 30px; height: 30px; }
  .sheet { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.4, 0, .2, 1); }
  #menu:checked ~ .sheet { grid-template-rows: 1fr; }
  .h1 { width: 100%; max-width: 15ch; font-size: clamp(29px, 7.6vw, 50px); line-height: 1.14; letter-spacing: -.012em; }
  .card {
    width: 100%; max-width: 600px; height: auto;
    display: flex; flex-direction: column; gap: clamp(16px, 4.6vh, 34px); padding: clamp(13px, 3.4vw, 18px);
  }
  .ph { position: static; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(9.4px, 2.95vw, 14px); }
  .tools { position: static; height: auto; display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
  .chips { flex-wrap: wrap; }
  .right { position: static; display: flex; align-items: center; justify-content: flex-start; }
  .right > * { position: static; }
  .attach { margin-left: auto; }
  .send { margin-left: 14px; width: 40px; height: 40px; }
}
@media (max-width: 1180px) and (max-height: 560px) {
  .hero { gap: 16px; }
  .h1 { font-size: clamp(24px, 5.4vh, 34px); }
  .proof { gap: 10px; }
  .frame { padding-top: 10px; }
}

/* ---------- entrance (once, first paint) ---------- */
@keyframes e-settle-down { from { opacity: 0; transform: translateY(calc(-5 * var(--u))); } }
@keyframes e-settle-up   { from { opacity: 0; transform: translateY(calc(6 * var(--u))); } }
@keyframes e-mark        { from { transform: scale(.9); } }
@keyframes e-focus       { from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); } to { filter: blur(0); } }
@keyframes e-panel       { from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.985); } }
@keyframes e-populate    { from { opacity: 0; transform: translateY(calc(4 * var(--u))); } }
@keyframes e-send        { from { transform: scale(.82); } }

@media (prefers-reduced-motion: no-preference) {
  .anim .brand { animation: e-settle-down .58s var(--e-soft) .06s both; }
  .anim .mark { animation: e-mark .62s var(--e-primary) .06s both; }
  .anim .links a { animation: e-settle-down .50s var(--e-soft) both; }
  .anim .links a:nth-child(1) { animation-delay: .16s; }
  .anim .links a:nth-child(2) { animation-delay: .21s; }
  .anim .links a:nth-child(3) { animation-delay: .26s; }
  .anim .links a:nth-child(4) { animation-delay: .31s; }
  .anim .nav .cta { animation: e-settle-down .55s var(--e-soft) .34s both; }
  .anim .h1 { animation: e-focus 1s var(--e-primary) .30s both; will-change: transform, opacity; }
  .anim .card { animation: e-panel .90s var(--e-primary) .62s both; will-change: transform, opacity; }
  .anim .ph { animation: e-populate .50s var(--e-soft) .88s both; }
  .anim .chips { animation: e-populate .50s var(--e-soft) .94s both; }
  .anim .right { animation: e-populate .50s var(--e-soft) 1.00s both; }
  .anim .send { animation: e-send .50s var(--e-primary) 1.00s both; }
  .anim .by { animation: e-settle-up .55s var(--e-soft) 1.08s both; }
  .anim .logos svg { animation: e-settle-up .55s var(--e-soft) both; }
  .anim .logos svg:nth-child(1) { animation-delay: 1.16s; }
  .anim .logos svg:nth-child(2) { animation-delay: 1.22s; }
  .anim .logos svg:nth-child(3) { animation-delay: 1.28s; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="stage">
  <video class="stage-video" src="bg_static.mp4" poster="bg.jpg" autoplay muted loop playsinline aria-hidden="true"></video>

  <div class="frame">
    <input type="checkbox" id="menu" class="menu-toggle" aria-label="Menu">

    <header class="nav">
      <a class="brand" href="#" aria-label="Fastshot home">
        <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
          <circle cx="17" cy="17" r="17" fill="#9C86CE"/>
          <circle cx="17" cy="17" r="8.6" fill="#FFFFFF"/>
          <circle cx="17" cy="17" r="3.7" fill="#151519"/>
        </svg>
        <span class="wordmark">Fastshot</span>
      </a>
      <nav class="links" aria-label="Primary">
        <a href="#">Features</a>
        <a href="#">Examples</a>
        <a href="#">Pricing</a>
        <a href="#">Docs</a>
      </nav>
      <a class="cta" href="#"><span>Get Started</span></a>
      <label class="burger" for="menu" aria-hidden="true">
        <svg viewBox="0 0 17 12"><rect y="2" width="17" height="1.7" rx=".85"/><rect y="8.3" width="17" height="1.7" rx=".85"/></svg>
      </label>
    </header>

    <div class="sheet">
      <div class="sheet-clip">
        <nav class="sheet-panel" aria-label="Mobile">
          <a href="#">Features</a>
          <a href="#">Examples</a>
          <a href="#">Pricing</a>
          <a href="#">Docs</a>
          <a class="sheet-cta" href="#">Get Started</a>
        </nav>
      </div>
    </div>

    <main class="hero">
      <h1 class="h1">Describe an app. We'll build it.</h1>

      <form class="card" onsubmit="return false">
        <p class="ph">Build a fintech tracking app with bank level privacy and...</p>
        <div class="tools">
          <div class="chips">
            <button type="button" class="chip" style="--cw:107;--pl:12;--ig:3.7">
              <svg class="ic" style="--iw:15.06" viewBox="0 0 30 22" aria-hidden="true">
                <mask id="m-screens"><rect width="30" height="22" fill="#fff"/><rect x="7.4" y="4.4" width="24" height="19" rx="4.2" fill="#000"/></mask>
                <rect width="20" height="15" rx="3.2" mask="url(#m-screens)"/>
                <rect x="9.6" y="6.6" width="20.4" height="15.4" rx="3.2"/>
              </svg>
              <span>Attach Screens</span>
            </button>
            <button type="button" class="chip" style="--cw:108;--pl:16;--ig:3.9">
              <svg class="ic" style="--iw:11.8" viewBox="0 0 12 18" aria-hidden="true">
                <path d="M5.7 0H3a2.8 2.8 0 0 0 0 5.6h2.7z"/>
                <path d="M6.3 0H9a2.8 2.8 0 0 1 0 5.6H6.3z"/>
                <path d="M5.7 6.2H3a2.8 2.8 0 0 0 0 5.6h2.7z"/>

<script>
(() => {
  const root = document.documentElement;
  if (!root.classList.contains('anim')) return;
  const done = () => root.classList.remove('anim');
  document.querySelector('.logos svg:last-child')?.addEventListener('animationend', done, { once: true });
  setTimeout(done, 2600);
})();
