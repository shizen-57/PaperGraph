<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1294 330" width="1294" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>DocLens pipeline: parse, route, extract, normalize, verify, serve</title>
<rect width="1294" height="330" rx="16" fill="#ffffff"/>
<text x="28" y="38" font-size="18" font-weight="700" fill="#1a1a1a">DocLens: every value is checked against the document before it is shown</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="28" y="70" width="188" height="176" rx="12" fill="#eef2ff" stroke="#9ca3af"/>
<text x="122.0" y="100" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">1. Parse</text>
<text x="122.0" y="134" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Docling (layout, tables, OCR)</text>
<text x="122.0" y="160" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">PDF text layer · Tesseract</text>
<text x="122.0" y="186" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">VLM page → Markdown</text>
<text x="122.0" y="212" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">PDF · image · PPTX</text>
<line x1="218" y1="158.0" x2="235" y2="158.0" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="238" y="70" width="188" height="176" rx="12" fill="#fef3c7" stroke="#9ca3af"/>
<text x="332.0" y="100" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">2. Route</text>
<text x="332.0" y="134" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">scanned page?</text>
<text x="332.0" y="160" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">table looks broken?</text>
<text x="332.0" y="186" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">figure / chart?</text>
<text x="332.0" y="212" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">→ VLM only for those</text>
<line x1="428" y1="158.0" x2="445" y2="158.0" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="448" y="70" width="188" height="176" rx="12" fill="#e0f2fe" stroke="#9ca3af"/>
<text x="542.0" y="100" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">3. Extract</text>
<text x="542.0" y="134" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">LLM behind LLM_BASE_URL</text>
<text x="542.0" y="160" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">schema-constrained JSON</text>
<text x="542.0" y="186" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">value + element id</text>
<text x="542.0" y="212" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">+ quote, copied exactly</text>
<line x1="638" y1="158.0" x2="655" y2="158.0" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="658" y="70" width="188" height="176" rx="12" fill="#ecfccb" stroke="#9ca3af"/>
<text x="752.0" y="100" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">4. Normalize</text>
<text x="752.0" y="134" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">NFKC: １２３ → 123</text>
<text x="752.0" y="160" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">令和8年10月24日 → 2026-10-24</text>
<text x="752.0" y="186" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">1億2,000万円 → 120000000</text>
<text x="752.0" y="212" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">税込 / 税抜 flag</text>
<line x1="848" y1="158.0" x2="865" y2="158.0" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="868" y="70" width="188" height="176" rx="12" fill="#dcfce7" stroke="#9ca3af"/>
<text x="962.0" y="100" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">5. Verify</text>
<text x="962.0" y="134" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">quote found in the element?</text>
<text x="962.0" y="160" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">value inside its quote?</text>
<text x="962.0" y="186" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">sums, tax 10% / 8%, dates</text>
<text x="962.0" y="212" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">→ verified / unverified</text>
<line x1="1058" y1="158.0" x2="1075" y2="158.0" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="1078" y="70" width="188" height="176" rx="12" fill="#fce7f3" stroke="#9ca3af"/>
<text x="1172.0" y="100" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">6. Serve</text>
<text x="1172.0" y="134" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">FastAPI</text>
<text x="1172.0" y="160" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Next.js + PDF viewer</text>
<text x="1172.0" y="186" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">click a field →</text>
<text x="1172.0" y="212" font-size="12.5" font-weight="600" fill="#374151" text-anchor="middle">its box lights up</text>
<text x="28" y="286" font-size="13" fill="#4b5563">Runs on a laptop CPU with committed results; GPU work (VLM parsers, vLLM, LoRA) runs on Kaggle and writes JSON into eval/results/.</text>
<text x="28" y="308" font-size="13" fill="#4b5563">OFFLINE=1 keeps everything on this machine: local models only, and the process refuses any connection that is not loopback or LAN.</text>
</svg>